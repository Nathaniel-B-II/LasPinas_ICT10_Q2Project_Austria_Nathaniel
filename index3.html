    <title>Third Page</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 18px;
            background: #1d63f0;
            color: #39404d;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            width: min(750px, 100%);
            margin: 0 auto;
            overflow: hidden;
            border-radius: 4px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(18, 56, 145, 0.2);
        }

        .site-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: #164fca;
        }

        .site-nav a {
            padding: 8px 13px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .site-nav a:hover,
        .site-nav a[aria-current="page"] {
            background: #ffffff;
            color: #164fca;
        }

        header {
            padding: 22px 20px 14px;
            background: #1d63f0;
            color: #ffffff;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .content {
            display: flex;
            flex-wrap: wrap;
            align-items: flex-start;
            justify-content: center;
            gap: 22px;
            padding: 24px;
        }

        .image-placeholder {
            display: grid;
            flex: 0 0 200px;
            width: 200px;
            height: 200px;
            place-items: center;
            border: 2px dashed #72b4ff;
            border-radius: 50%;
            background: #e9f1fb;
            color: #39404d;
            text-align: center;
        }

        .profile-image {
            display: block;
            flex: 0 0 200px;
            width: 200px;
            height: 200px;
            border-radius: 50%;
            object-fit: cover;
        }

        .paragraph-area {
            flex: 1;
            min-width: 240px;
            min-height: 200px;
            padding: 13px;
            border: 1px solid #dfe4ea;
            border-radius: 5px;
            color: #39404d;
            font: inherit;
            line-height: 1.5;
            resize: vertical;
        }
    </style>
</head>
