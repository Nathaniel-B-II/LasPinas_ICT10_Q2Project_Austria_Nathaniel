<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Anti-Kenzo Club</title>
    <style>
        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            padding: 30px 18px;
            background: #1d63f0;
            color: #39404d;
            font-family: Arial, Helvetica, sans-serif;
        }

        .app {
            width: min(750px, 100%);
            margin: 0 auto;
            overflow: hidden;
            border-radius: 4px;
            background: #ffffff;
            box-shadow: 0 12px 30px rgba(18, 56, 145, 0.2);
        }

        .site-nav {
            display: flex;
            justify-content: center;
            flex-wrap: wrap;
            gap: 10px;
            padding: 12px;
            background: #164fca;
        }

        .site-nav a {
            padding: 8px 13px;
            border: 1px solid rgba(255, 255, 255, 0.35);
            border-radius: 999px;
            color: #ffffff;
            font-size: 13px;
            font-weight: 700;
            text-decoration: none;
        }

        .site-nav a:hover,
        .site-nav a[aria-current="page"] {
            background: #ffffff;
            color: #164fca;
        }

        header {
            padding: 22px 20px 14px;
            background: #1d63f0;
            color: #ffffff;
            text-align: center;
        }

        h1 {
            margin: 0;
            font-size: 22px;
        }

        .subtitle {
            margin-top: 5px;
            font-size: 13px;
        }

        .content { padding: 22px; }

        .intro {
            margin: 0 0 20px;
            padding: 12px 14px;
            border-left: 5px solid #72b4ff;
            border-radius: 4px;
            background: #e9f1fb;
            line-height: 1.5;
        }

        .stats {
            display: flex;
            flex-wrap: wrap;
            gap: 12px;
            margin-bottom: 20px;
        }

        .stat {
            flex: 1;
            min-width: 130px;
            padding: 12px;
            border: 1px solid #dfe4ea;
            border-radius: 5px;
            text-align: center;
        }

        .stat strong {
            display: block;
            color: #1d63f0;
            font-size: 20px;
        }

        .stat span { font-size: 12px; }

        .card {
            padding: 18px;
            border: 1px solid #dfe4ea;
            border-radius: 5px;
        }

        h2 {
            margin: 0 0 14px;
            color: #1789bc;
            font-size: 18px;
        }

        label {
            display: block;
            margin-bottom: 5px;
            font-size: 14px;
            font-weight: 700;
        }

        input {
            width: 100%;
            height: 42px;
            padding: 8px 13px;
            border: 1px solid #dfe4ea;
            border-radius: 5px;
            color: #39404d;
            font-size: 15px;
        }

        .field { margin-bottom: 12px; }

        button {
            width: 100%;
            height: 46px;
            border: 0;
            border-radius: 5px;
            background: #249b84;
            color: #ffffff;
            font-size: 15px;
            font-weight: 700;
            cursor: pointer;
        }

        button:hover { background: #208c78; }

        .result {
            min-height: 42px;
            margin-top: 14px;
            padding: 12px;
            border: 1px solid #b9d9fb;
            border-radius: 5px;
            background: #e7f2ff;
            line-height: 1.4;
        }

        .result.success {
            border-color: #9cdbab;
            background: #eaf8ed;
            color: #216b31;
        }

        .result.error {
            border-color: #efb1bd;
            background: #fff0f2;
            color: #9d2b40;
        }
    </style>
</head>
<body>
    <main class="app">
        <nav class="site-nav" aria-label="Main navigation">
            <a href="index.html">Non-Metal Elements</a>
            <a href="index2.html" aria-current="page">Anti-Kenzo Club</a>
            <a href="index3.html">Meet the Creator</a>
        </nav>

        <header>
            <h1>Anti-Kenzo Club</h1>
        </header>

        <section class="content">
            <section class="card">
                <h2>Member Check</h2>
                <form id="clubForm">
                    <div class="field">
                        <label for="first_name">First name</label>
                        <input type="text" id="first_name" placeholder="Enter your first name" required>
                    </div>
                    <div class="field">
                        <label for="last_name">Last name</label>
                        <input type="text" id="last_name" placeholder="Enter your last name" required>
                    </div>
                    <button type="submit">Verify access</button>
                </form>
                <div id="result" class="result" aria-live="polite">Awaiting confirmation...</div>
            </section>
        </section>
    </main>

    <script>
        const clubMembers = [
            "ethan castaneda",
            "kenzo cutamora",
            "briel lagran",
            "joaquin galura",
            "kyle dela calzada"
        ];

        const form = document.getElementById("clubForm");
        const result = document.getElementById("result");

        form.addEventListener("submit", function (event) {
            event.preventDefault();

            const firstName = document.getElementById("first_name").value.trim();
            const lastName = document.getElementById("last_name").value.trim();
            const candidate = `${firstName} ${lastName}`.toLowerCase();

            if (clubMembers.includes(candidate)) {
                result.textContent = `Congratulations, ${firstName} ${lastName}! You are a confirmed member of the Anti-Kenzo Club.`;
                result.className = "result success";
            } else {
                result.textContent = `Sorry, ${firstName} ${lastName}. Your name is not on the approved resistance list.`;
                result.className = "result error";
            }
        });
    </script>
</body>
</html>
